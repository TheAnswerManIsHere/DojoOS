openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
servers:
  - url: /app-api
paths:
  /session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /auth/request:
    post:
      operationId: requestLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailInput" }
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkRequestResponse" }
  /auth/verify:
    post:
      operationId: verifyLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /shoots:
    get:
      operationId: listShoots
      responses:
        "200":
          description: Shoots with sources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Shoot" }
    post:
      operationId: createShoot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShootInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shoot" }
  /uploads:
    post:
      operationId: startUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "201":
          description: Multipart upload created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
  /uploads/{id}/parts:
    post:
      operationId: signPart
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartInput" }
      responses:
        "200":
          description: Presigned part
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedUrl" }
  /uploads/{id}/complete:
    post:
      operationId: completeUpload
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartsInput" }
      responses:
        "200":
          description: Upload finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
  /sources/{id}/retry:
    post:
      operationId: retryIngest
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Ingest queued again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
  /sources/{id}/transcribe:
    post:
      operationId: transcribeSource
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Transcription queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "409":
          description: Not transcribable now (no proxy, or a transcription is already queued or running)
  /sources/{id}/playback:
    get:
      operationId: getPlayback
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Signed playback URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedUrl" }
  /sources/{id}/transcript:
    get:
      operationId: getTranscript
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The source's newest transcript
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transcript" }
        "404":
          description: The source has no transcript
  /sources/{id}/log:
    get:
      operationId: getSourceLog
      description: Everything the logging viewer needs for one source — its bricks, the newest transcript's words, and the derived media that exist.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The source's log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceLog" }
        "404":
          description: The source does not exist or is not ready
  /sources/{id}/commands:
    post:
      operationId: applySourceCommand
      description: Applies one command of the closed set to the source's bricks, and records it as a source-owned event.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandInput" }
      responses:
        "200":
          description: The bricks after the command, and the command that reverses it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "400":
          description: Not a command of the set
        "409":
          description: The command does not apply to the bricks as they stand
  /sources/{id}/peaks:
    get:
      operationId: getSourcePeaks
      description: The waveform peaks file, relayed from storage (the bucket is private and serves no cross-origin reads).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Peaks in the audiowaveform JSON shape
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Peaks" }
        "404":
          description: The source has no peaks file
  /questions:
    get:
      operationId: listQuestions
      parameters:
        - { name: feature, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Active questions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Question" }
  /feedback:
    get:
      operationId: listFeedback
      responses:
        "200":
          description: Feedback records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Feedback" }
    post:
      operationId: submitFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackInput" }
      responses:
        "201":
          description: Answer saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feedback" }
components:
  schemas:
    LogBrick:
      type: object
      required: [id, inMs, outMs, openSeq, action, preset, tags]
      properties:
        id: { type: string }
        inMs: { type: integer }
        outMs: { type: ["integer", "null"], description: "Null while the brick is open." }
        openSeq: { type: ["integer", "null"], description: "Order among open bricks; O closes the highest." }
        action: { type: string, enum: [keep, punch_in] }
        preset: { type: ["string", "null"], description: "The framing preset of a punch-in." }
        tags: { type: array, items: { type: string } }
    SourceLog:
      type: object
      required: [sourceId, shootName, durationMs, fps, bricks, words, spriteUrl, spriteLayout, hasPeaks]
      properties:
        sourceId: { type: string }
        shootName: { type: string }
        durationMs: { type: integer }
        fps: { type: ["number", "null"] }
        bricks: { type: array, items: { $ref: "#/components/schemas/LogBrick" } }
        words:
          type: ["array", "null"]
          description: The newest transcript's words; null when the source has none.
          items:
            type: object
            required: [text, start_ms, end_ms]
            properties: { text: { type: string }, start_ms: { type: integer }, end_ms: { type: integer } }
        spriteUrl: { type: ["string", "null"] }
        spriteLayout:
          type: ["object", "null"]
          required: [intervalSeconds, count, columns, rows, tileWidth, tileHeight]
          properties:
            intervalSeconds: { type: number }
            count: { type: integer }
            columns: { type: integer }
            rows: { type: integer }
            tileWidth: { type: integer }
            tileHeight: { type: integer }
        hasPeaks: { type: boolean }
    CommandInput:
      type: object
      required: [command]
      properties:
        command: { type: object, additionalProperties: true, description: "One command of the closed set in lib/shared/src/commands.ts." }
    CommandResult:
      type: object
      required: [bricks, inverse]
      properties:
        bricks: { type: array, items: { $ref: "#/components/schemas/LogBrick" } }
        inverse: { type: object, additionalProperties: true }
    Peaks:
      type: object
      required: [sample_rate, samples_per_pixel, length, data]
      properties:
        sample_rate: { type: integer }
        samples_per_pixel: { type: integer }
        length: { type: integer }
        data: { type: array, items: { type: integer } }
    Ok:
      type: object
      required: [ok]
      properties: { ok: { type: boolean } }
    LinkRequestResponse:
      type: object
      required: [ok]
      properties: { ok: { type: boolean }, magicLink: { type: string, description: "Development-only sign-in link; never returned in production." } }
    Account:
      type: object
      required: [id, email, tier]
      properties:
        id: { type: string }
        email: { type: string }
        tier: { type: string, enum: [operator, tester] }
    EmailInput:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    TokenInput:
      type: object
      required: [token]
      properties: { token: { type: string } }
    Source:
      type: object
      required: [id, role, ingestState, hasProxy, lastError, retryable]
      properties:
        id: { type: string }
        role: { type: string, enum: [camera_a, camera_b, audio] }
        ingestState: { type: string }
        durationMs: { type: ["integer", "null"] }
        width: { type: ["integer", "null"] }
        height: { type: ["integer", "null"] }
        fps: { type: ["number", "null"] }
        hasProxy: { type: boolean, description: "A playable proxy exists; the playback URL is then the proxy's." }
        lastError: { type: ["string", "null"], description: "The last ingest error, while the source is failed." }
        retryable: { type: boolean, description: "The source can be processed again from the library." }
        transcriptWords: { type: ["integer", "null"], description: "Words in the newest transcript; null when there is none yet." }
        transcriptionState: { type: ["string", "null"], description: "The newest transcription job's state (queued, claimed, completed, failed); null when none has run." }
        transcriptionError: { type: ["string", "null"], description: "Why the newest transcription failed, while it is failed." }
    Transcript:
      type: object
      required: [provider, version, createdAt, words]
      properties:
        provider: { type: string }
        version: { type: string, description: "The provider's model that produced it." }
        createdAt: { type: string }
        words:
          type: array
          items:
            type: object
            required: [text, start_ms, end_ms]
            properties: { text: { type: string }, start_ms: { type: integer }, end_ms: { type: integer } }
    Shoot:
      type: object
      required: [id, name, sources]
      properties:
        id: { type: string }
        name: { type: string }
        shotOn: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        sources:
          type: array
          items: { $ref: "#/components/schemas/Source" }
    ShootInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        shotOn: { type: string }
        notes: { type: string }
    UploadInput:
      type: object
      required: [shootId, role, fileName, contentType]
      properties:
        shootId: { type: string }
        role: { type: string, enum: [camera_a, camera_b, audio] }
        fileName: { type: string }
        contentType: { type: string }
    Upload:
      type: object
      required: [id, uploadId]
      properties:
        id: { type: string }
        uploadId: { type: string }
    PartInput:
      type: object
      required: [uploadId, partNumber]
      properties:
        uploadId: { type: string }
        partNumber: { type: integer, minimum: 1, maximum: 10000 }
    PartsInput:
      type: object
      required: [uploadId, parts]
      properties:
        uploadId: { type: string }
        parts:
          type: array
          items:
            type: object
            required: [partNumber, etag]
            properties:
              partNumber: { type: integer }
              etag: { type: string }
    SignedUrl:
      type: object
      required: [url]
      properties: { url: { type: string } }
    Question:
      type: object
      required: [id, feature, key, prompt, position]
      properties:
        id: { type: string }
        feature: { type: string }
        key: { type: string }
        prompt: { type: string }
        position: { type: integer }
    FeedbackInput:
      type: object
      required: [questionKey, answer, page, state]
      properties:
        questionKey: { type: string }
        answer: { type: string }
        page: { type: string }
        state: { type: object, additionalProperties: true }
    Feedback:
      type: object
      required: [id, userId, questionKey, answer, page, buildVersion, state, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        questionKey: { type: string }
        answer: { type: string }
        page: { type: string }
        buildVersion: { type: string }
        state: { type: object, additionalProperties: true }
        createdAt: { type: string }