name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Two jobs whose names are the required checks in the `main` ruleset
# ("Build" and "Test"). Renaming either job means editing that ruleset.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/web lint
      # Package tests need the workspace's dependencies, which only this job installs.
      - run: pnpm -r --if-present run test
      # check-docs-accuracy.mjs is left out until the handbook exempts synced files
      # from its path rule: every failure today is a vendored doc citing another
      # product's paths (docs/engineering/deferred-work.md).

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/__tests__/*.test.mjs
      - run: node scripts/check-uat-format.mjs
