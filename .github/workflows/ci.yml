name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Two jobs whose names are the required checks in the `main` ruleset
# ("Build" and "Test"). Renaming either job means editing that ruleset.
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04  # pinned 2026-10-21: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install Chromium on
    # The worker's queue tests and the web step-0 journeys run against a real Postgres,
    # migrated by the same drizzle-kit command the Repl uses.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dojo
          POSTGRES_PASSWORD: dojo
          POSTGRES_DB: dojo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dojo -d dojo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://dojo:dojo@127.0.0.1:5432/dojo_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/web lint
      - run: pnpm --filter @workspace/shared run migrate
      # The worker's media tests run the real ffmpeg and ffprobe on generated clips. The runner's package mirror crawled
      # at 50-100 KB/s three times on 2026-10-22 (#24, #26, #28: 62.8 MB of packages, past the 12-minute ceiling #27 set),
      # so ffmpeg's packages are cached: the first good run downloads them, and every later run on the same runner image
      # installs them from the cache without touching the mirror. The key carries the image version, since the packages
      # are resolved against that image's installed libraries.
      # ImageOS and ImageVersion are the runner process's environment, which `${{ env.* }}` cannot see (it holds only
      # what the workflow sets), so a shell step reads them; `:?` fails the step rather than keying on an empty string.
      - id: image
        run: echo "key=ffmpeg-debs-${ImageOS:?}-${ImageVersion:?}-v1" >> "$GITHUB_OUTPUT"
      - id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-debs
          key: ${{ steps.image.outputs.key }}
      - if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: |
          mkdir -p ~/ffmpeg-debs
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -q &&
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::archives="$HOME/ffmpeg-debs" \
              install -y -q --no-install-recommends --download-only ffmpeg && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "apt attempt $attempt failed; retrying"; sleep 10
          done
          sudo chown -R "$USER" ~/ffmpeg-debs
          find ~/ffmpeg-debs -mindepth 1 ! -name '*.deb' -exec rm -rf {} +
      - run: sudo dpkg -i ~/ffmpeg-debs/*.deb && ffmpeg -version | head -1 && ffprobe -version | head -1
        timeout-minutes: 5
      # The browser journey drives Chromium; one install step, pinned by the web package's playwright version.
      - run: pnpm --filter @workspace/web exec playwright install --with-deps chromium
      # Package tests need the workspace's dependencies, which only this job installs.
      - run: pnpm -r --if-present run test
      # The step-0 journeys spawn the real web server against the migrated database.
      - run: pnpm -r --if-present run test:journeys
      # check-docs-accuracy.mjs is left out until the handbook exempts synced files
      # from its path rule: every failure today is a vendored doc citing another
      # product's paths (docs/engineering/deferred-work.md).

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/__tests__/*.test.mjs
      - run: node scripts/check-uat-format.mjs
