kind = "web"
previewPath = "/"
title = "DojoOS"
description = "Private single-operator video production intake and feedback web app."
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22333

[services.development]
run = "node ../../scripts/run-production.mjs --dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/web", "run", "build" ]
run = [ "sh", "-c", "if [ -f scripts/run-production.mjs ]; then exec node scripts/run-production.mjs; else exec node ../../scripts/run-production.mjs; fi" ]

[services.env]
PORT = "22333"
BASE_PATH = "/"