kind = "web"
previewPath = "/"
title = "DojoOS"
description = "Private single-operator video production intake and feedback web app."
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22333

[services.development]
run = "pnpm --filter @workspace/web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/web", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/web", "run", "serve" ]

[services.env]
PORT = "22333"
BASE_PATH = "/"